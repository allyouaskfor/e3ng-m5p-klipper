[include mainsail.cfg]
[include macros.cfg]
[include PARKING.cfg]
[include klicky-probe.cfg]
[include bedprobe.cfg]
[include startend.cfg]
[include autotune.cfg]
[include leds.cfg]
[include led_progress.cfg]

[skew_correction]

[firmware_retraction]
retract_length: 0.4
retract_speed: 40
unretract_extra_length: 0
unretract_speed: 20

[gcode_arcs]
resolution: 1.0

[exclude_object]

[force_move]
# enable_force_move: true

[probe]
#z_offset: 10.210

[stepper_x]
step_pin: PC8
dir_pin: !PC9
enable_pin: !PA15
microsteps: 64
full_steps_per_rotation: 400
rotation_distance: 40
endstop_pin: ^PD3
position_endstop: 0
position_max: 232.5
homing_speed: 50
homing_retract_dist: 5
second_homing_speed: 10

[stepper_y]
step_pin: PA10
dir_pin: !PA14
enable_pin: !PA13
microsteps: 64
full_steps_per_rotation: 400
rotation_distance: 40
endstop_pin: ^PD2
position_endstop: 247
position_max: 247
homing_speed: 50
homing_retract_dist: 5
second_homing_speed: 10

[stepper_z]
step_pin: PC6
dir_pin: PC7
enable_pin: !PA9
microsteps: 128
full_steps_per_rotation: 200
rotation_distance: 8
gear_ratio: 42:20
# endstop_pin: ^PC3
endstop_pin: probe:z_virtual_endstop
position_min: -9
position_max: 230
homing_speed: 50
homing_retract_dist: 5
second_homing_speed: 5
# homing_positive_dir: true

[extruder]
step_pin: PB12
dir_pin: !PB11
enable_pin: !PA8
microsteps: 128
# gear_ratio: 80:20        # Voron M4
gear_ratio: 5:1        # Sherpa Mini
pressure_advance: 0.280
pressure_advance_smooth_time: 0.040
# rotation_distance: 20.7603        # Voron M4
rotation_distance: 22.67895
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC5
sensor_type: ATC Semitec 104NT-4-R025H42G
# sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA1
min_temp: -50
max_temp: 290
max_extrude_only_distance: 700
max_extrude_only_velocity: 200

#[filament_switch_sensor material_0]
#switch_pin: PC2

[heater_bed]
heater_pin: PA5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
#control: pid
min_temp: 0
max_temp: 130
#pid_kp = 73.742
#pid_ki = 1.713
#pid_kd = 793.653

[fan]
pin: PA4

[heater_fan fan1]
pin: PA3

#[heater_fan SoC_fan]
#pin: CB1:gpio79

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_400058000E504B5735313920-if00

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 2400
max_z_velocity: 5
max_z_accel: 100
square_corner_velocity: 5

[input_shaper]
shaper_freq_x: 53.736
shaper_freq_y: 50.314
shaper_type: mzv

########################################
# TMC2209 configuration
########################################

[tmc2209 stepper_x]
uart_pin: PD9
run_current: 1.130
hold_current: 0.400
diag_pin: PD3
interpolate: True
# stealthchop_threshold: 999999

[tmc2209 stepper_y]
uart_pin: PD8
run_current: 1.130
hold_current: 0.400
diag_pin: PD2
interpolate: True
# stealthchop_threshold: 999999

[tmc2209 stepper_z]
uart_pin: PB10
run_current: 1.130
diag_pin: PC3
interpolate: True
# stealthchop_threshold: 999999

[tmc2209 extruder]
uart_pin: PB2
run_current: 0.450
hold_current: 0.200
# diag_pin: PC2
interpolate: False
#stealthchop_threshold: 999999

#[tmc2209 extruder1]
#uart_pin: PA6
#run_current: 0.600
#diag_pin:

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PD5, EXP1_3=PB3, EXP1_5=PB5, EXP1_7=PB7, EXP1_9=<GND>,
    EXP1_2=PD4,  EXP1_4=PD6, EXP1_6=PB4, EXP1_8=PB6, EXP1_10=<5V>,
    # EXP2 header
    EXP2_1=PB14, EXP2_3=PB8, EXP2_5=PC10, EXP2_7=PC12,  EXP2_9=<GND>,
    EXP2_2=PB13, EXP2_4=PB9, EXP2_6=PB15, EXP2_8=<RST>, EXP2_10=<NC>

